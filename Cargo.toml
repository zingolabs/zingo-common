[workspace]
members = ["zingo_common_components", "zingo-netutils"]
resolver = "2"
package.edition = "2024"

[workspace.dependencies]
# network
http = "1.1.0"
hyper-util = "0.1.20"
hyper = { version = "1" }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12", "logging", "native-tokio"] }
http-body-util = "0.1.3"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tokio = { version = "1" }
tonic = { version = "0.14.4", features = ["tls-webpki-roots"] }

# nym / socks5
nym-sdk = { git = "https://github.com/idky137/nym.git", branch = "nym_wallet_poc_2_1" }
nym-http-api-client = { git = "https://github.com/idky137/nym.git", branch = "nym_wallet_poc_2_1", package = "nym-http-api-client" }
nym-validator-client = { git = "https://github.com/idky137/nym.git", branch = "nym_wallet_poc_2_1", package = "nym-validator-client", default-features = false, features = ["http-client"] }
tokio-socks = "0.5"
tower = "0.5"
webpki-roots = "0.26"

# error
thiserror = "1.0.64"
x509-parser = "0.18"
lightwallet-protocol = "0.3.0"
tokio-stream = "0.1"
zcash_client_backend = { version = "0.21", features = ["lightwalletd-tonic"] }
