[workspace]
members = ["zingo_common_components", "zingo-netutils"]
resolver = "2"
package.edition = "2024"

[workspace.dependencies]
# network
http = "1.1.0"
hyper-util = "0.1.20"
hyper = { version = "1" }
hyper-rustls = { version = "0.27", default-features = false, features = [
    "ring",
    "http1",
    "tls12",
    "logging",
    "native-tokio",
] }
http-body-util = "0.1.3"
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
tokio = { version = "1" }
tonic = { version = "0.14.4", features = ["tls-webpki-roots"] }

# error
thiserror = "1.0.64"
x509-parser = "0.18"
lightwallet-protocol = "0.3.0"
lwd-uri-util = "0.1.7"
tokio-stream = "0.1"

# encoding
hex = "0.4.3"
