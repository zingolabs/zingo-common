[package]
name = "zingo-netutils"
version = "1.1.0"
description = "network utility crate"
authors = ["zingo@zingolabs.org"]
edition = "2024"
repository = "https://github.com/zingolabs/zingo-common"
homepage = "https://github.com/zingolabs/zingo-common"
license = "MIT"

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
http-body.workspace = true
http.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
hyper.workspace = true
thiserror.workspace = true
tokio-rustls.workspace = true
tonic.workspace = true
tower.workspace = true
webpki-roots = "0.25"

zcash_client_backend = { version = "0.23", features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
    "tor",
] }

[dev-dependencies]
rustls-pemfile.workspace = true
