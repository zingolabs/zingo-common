# fly.toml app configuration file generated for grpc-echo-server on 2026-05-06T00:50:17+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grpc-echo-server'
primary_region = 'fra'

[build]
  dockerfile = 'grpc-echo-server/Dockerfile'

[http_service]
  internal_port = 8137
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.http_options]
    h2_backend = true

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
